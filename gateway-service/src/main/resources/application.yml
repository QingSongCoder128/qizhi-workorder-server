server:
  port: 10001

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # 路由规则（后续迁移到 Nacos 配置中心）
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/user/**,/api/v1/dept/**,/api/v1/role/**
        - id: work-order-service
          uri: lb://work-order-service
          predicates:
            - Path=/api/v1/workorder/**
        - id: approve-service
          uri: lb://approve-service
          predicates:
            - Path=/api/v1/approve/**
        - id: message-service
          uri: lb://message-service
          predicates:
            - Path=/api/v1/message/**
        - id: ai-process-service
          uri: lb://ai-process-service
          predicates:
            - Path=/api/v1/ai/**
        - id: statistics-service
          uri: lb://statistics-service
          predicates:
            - Path=/api/v1/stats/**

# 日志级别
logging:
  level:
    com.qizhi: INFO

# Actuator 运维监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
