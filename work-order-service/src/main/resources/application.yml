server:
  port: 10003

spring:
  application:
    name: work-order-service
  datasource:
    hikari:
      maximum-pool-size: 40
      minimum-idle: 10
      connection-timeout: 3000
  cloud:
    openfeign:
      client:
        config:
          default:
            # Feign 连接超时（毫秒）: 与下游服务建立 TCP 连接的最大等待时间
            connect-timeout: 3000
            # Feign 读取超时（毫秒）: 等待下游服务返回响应数据的最大时间
            read-timeout: 5000
            # Feign 日志级别: BASIC=仅记录请求方法、URL、响应状态码及耗时
            logger-level: BASIC
          ai-process-service:
            # AI 服务内部模型调用可能耗时较长，单独配置更大超时
            connect-timeout: 5000
            read-timeout: 30000

# 日志级别
logging:
  level:
    com.qizhi: INFO

springdoc:
  api-docs:
    enabled: true
knife4j:
  enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
