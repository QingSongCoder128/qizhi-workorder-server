server:
  port: 10003

spring:
  application:
    name: work-order-service
  cloud:
    openfeign:
      client:
        config:
          default:
            # Feign 连接超时（毫秒）: 与下游服务建立 TCP 连接的最大等待时间
            connect-timeout: 3000
            # Feign 读取超时（毫秒）: 等待下游服务返回响应数据的最大时间
            read-timeout: 3000
            # Feign 日志级别: BASIC=仅记录请求方法、URL、响应状态码及耗时
            logger-level: BASIC

# 日志级别
logging:
  level:
    com.qizhi: INFO

springdoc:
  api-docs:
    enabled: true
knife4j:
  enable: true
