server:
  port: 10004

spring:
  application:
    name: approve-service
  datasource:
    hikari:
      maximum-pool-size: 100
      minimum-idle: 10
      connection-timeout: 5000

# 日志级别
logging:
  level:
    com.qizhi: INFO

springdoc:
  api-docs:
    enabled: true
knife4j:
  enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
